version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
  # Maintain Docker image digests referenced in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"