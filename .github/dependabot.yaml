version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Ktor 2.3.13 bruker coroutine-API-er som er inkompatible med coroutines 1.11.0.
      # Unntaket kan fjernes ved oppgradering til en annen Ktor-versjon med verifisert kompatibilitet.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        versions: [">=1.11.0"]
    groups:
      dependencies:
        patterns:
          - "*"
  # Maintain Docker image digests referenced in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
