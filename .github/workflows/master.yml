name: build
permissions:
  contents: "read"
on:
  push:
    branches:
      - master

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
      packages: "read"
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: test and build
        uses: actions/setup-java@v4.9.1
        with:
          distribution: 'temurin'
          java-version: '20'
          check-latest: true
      - run: ./gradlew test shadowJar
        env:
          ORG_GRADLE_PROJECT_githubUser: x-access-token
          ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}
      - uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: medlemskap # required
      - name: Post failures to Slack
        if: failure()
        run: |
          curl -X POST --data-urlencode "payload={\"channel\": \"$CHANNEL\", \"text\": \"$MESSAGE\", \"icon_emoji\": \":ghost:\"}" $WEBHOOK_URL
        env:
          MESSAGE: "Bygg feilet"
          CHANNEL: "#lovme-teknisk"
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploypreprod:
    name: Deploy to preprod
    needs: build_and_push
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v6
      - uses: nais/setup@v1
        with:
          team: medlemskap
      - name: Deploy to dev-gcp
        run: |
          nais apply .nais/preprod.yaml \
            --environment dev-gcp \
            --set spec.image="${{ needs.build_and_push.outputs.image }}" \
            --wait
  deployprod:
    name: Deploy to prod
    needs: build_and_push
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v6
      - uses: nais/setup@v1
        with:
          team: medlemskap
      - name: Deploy to prod-gcp
        run: |
          nais apply .nais/topics/topic-medlemskap-stage1-prod.yaml --environment prod-gcp
          nais apply .nais/prod.yaml \
            --environment prod-gcp \
            --set spec.image="${{ needs.build_and_push.outputs.image }}" \
            --wait